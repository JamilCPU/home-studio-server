# Home Studio Configuration
# Copy to config.local.yaml for local overrides (git-ignored)

youtube:
  # OAuth credentials — set in environment or config.local.yaml
  client_id: ""
  client_secret: ""
  project_id: ""
  # Home Studio: API key only (set via HOME_STUDIO_YOUTUBE_API_KEY or config.local.yaml)
  api_key: ""
  cookies_path: "secrets/cookies.txt"
  quota_ceiling: 9500
  # YouTube account sign-in (device code). Client ID/secret go in config.local.yaml
  # (scripts: set-youtube-oauth-client.ps1); the token file is written by the server.
  oauth_client_id: ""
  oauth_client_secret: ""
  oauth_token_path: "secrets/youtube_oauth.json"

curation:
  # How many candidate videos to fetch from subscriptions + search
  max_candidates: 80
  # How many candidates to fetch transcripts for (top N by recency/views)
  transcript_candidates: 30
  # Language filter
  language: "en"

scoring:
  # Max tokens for scoring prompt
  max_prompt_tokens: 50000

api:
  host: "0.0.0.0"
  port: 8765

bluetooth:
  adapter: "hci1"
  speaker_mac: ""
  label: "Echo"

# --- Home Studio ---------------------------------------------------------
# Secrets (API key, speaker MAC) belong in config.local.yaml or HOME_STUDIO_* env vars.
general:
  timezone: "America/Chicago"

db:
  # Relative paths (here and youtube.cookies_path) resolve against this file's directory.
  path: "data/home_studio.db"

player:
  mpv_socket: "/tmp/home-studio-mpv.sock"

agent:
  claude_command: "claude"
  timeout_s: 300
  # Extra CLI args (Claude Code 2.1.86): no tools, no MCP servers, no saved session.
  # Each call also runs in a fresh empty temp directory.
  claude_args: ["--tools", "", "--strict-mcp-config", "--mcp-config", '{"mcpServers":{}}',
                "--no-session-persistence"]
